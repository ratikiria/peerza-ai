<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Peerza favicon: emerald rocket-P + amber moon on a dark glass tile.
       Simplified from the navbar PeerzaP so it reads at 16px. -->
  <defs>
    <radialGradient id="tile" cx="0.3" cy="0.2" r="1">
      <stop offset="0%" stop-color="#1c2533" />
      <stop offset="100%" stop-color="#0b0e14" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#tile)" />
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.25" fill="none" stroke="url(#rim)" stroke-width="1.5" />
  <circle cx="34" cy="24" r="20" fill="url(#glow)" />

  <!-- Rocket-P glyph (same 22x36 geometry as components/brand/Logo.tsx) -->
  <g transform="translate(20.6 8.4) scale(1.3)">
    <path d="M2.2 29.6 Q1.8 33.4 5 36.8 Q8.2 33.4 7.8 29.6 Z" fill="url(#flame)" />
    <circle cx="10" cy="10" r="7.5" fill="url(#stem)" />
    <circle cx="12.6" cy="10" r="4.6" fill="url(#moon)" />
    <circle cx="11.6" cy="8.8" r="1.4" fill="#ffffff" fill-opacity="0.45" />
    <rect x="2" y="3" width="6" height="27" rx="1" fill="url(#stem)" />
    <path d="M2 3 L8 3 L5 -1.2 Z" fill="#34d399" />
    <path d="M8 22 L11 28.6 L8 26 Z" fill="#047857" />
    <path d="M2 22 L-1 28.6 L2 26 Z" fill="#047857" />
    <circle cx="5" cy="20" r="1.6" fill="#0b0e14" />
    <circle cx="5" cy="20" r="0.95" fill="#6ee7b7" />
  </g>
</svg>
